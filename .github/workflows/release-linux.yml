---
name: Release - Linux AppImage
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build-linux.yml
    with:
      release_tag: ${{ github.ref_name }}

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built AppImages
        uses: actions/download-artifact@v6
        with:
          pattern: StreamLight-LinuxAppImage-*-${{ github.ref_name }}
          merge-multiple: true
          path: appimage

      - name: Attach AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          # Stay a draft: the release is published in one step, once every asset
          # is attached, so its page never shows notes with nothing to download.
          # Left off, this action finalises (publishes) a draft by itself.
          draft: true
          files: appimage/*.AppImage
