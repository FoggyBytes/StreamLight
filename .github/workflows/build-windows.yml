name: Build Windows

# Builds StreamLight and its installer on GitHub's runner, the way the local release build does:
# scripts\build-arch.bat release, then ISCC on StreamLight.iss. Nothing is published - the
# outputs are workflow artifacts.
#
# Code signing through the SignPath Foundation (SignPath signs only files a GitHub Actions run
# produced). It switches itself on when the repository has the secret SIGNPATH_API_TOKEN, and
# also needs the variable SIGNPATH_ORGANIZATION_ID (Settings -> Secrets and variables ->
# Actions). Without the secret the run is the unsigned build it was before. With it, two
# signing requests, each one approved by hand in the SignPath portal when the policy asks:
#   1. StreamLight.exe, AntiHooking.dll and the Inno Setup uninstaller - which is also the Setup
#      program the installer unpacks to %TEMP% and runs (see StreamLight.iss, SignedUninstaller);
#   2. the finished installer, compiled again around the signed uninstaller.
# The artifact configurations they refer to are kept for review in docs/signpath/.
#
# Differences from the local build, on purpose:
#  - Visual Studio is whatever the runner image carries (logged below); the VC_redist bundled by
#    the installer is taken from that same toolset.
#  - build-arch.bat runs with STREAMLIGHT_DEPLOY_ONLY, so it stops once the deploy folder is
#    complete instead of failing on the WiX step (the local build fails there, then the exe is
#    copied by hand: same folder, same contents).

on:
  workflow_dispatch:
    inputs:
      signing_policy:
        description: SignPath signing policy (used only when SIGNPATH_API_TOKEN is set)
        type: choice
        options:
          - test-signing
          - release-signing
        default: test-signing

permissions:
  contents: read
  # The SignPath action reads this run's job details and artifacts with the GITHUB_TOKEN.
  actions: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.0
  INNO_VERSION: 7.0.2
  # SHA-256 of innosetup-7.0.2-x64.exe as published on jrsoftware/issrc's GitHub release is-7_0_2
  INNO_SHA256: 5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1

jobs:
  build:
    runs-on: windows-2025
    # Room for a release-signing request to wait for its manual approval.
    timeout-minutes: 240
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'StreamLight' }}
      SIGNPATH_POLICY: ${{ inputs.signing_policy || 'test-signing' }}
      SIGNPATH_WAIT_SECONDS: ${{ inputs.signing_policy == 'release-signing' && '7200' || '900' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # version.txt carries a UTF-8 BOM and no newline; ReadAllText drops the BOM.
          $app = [IO.File]::ReadAllText("$PWD\app\version.txt").Trim()
          $iss = (Select-String -Path StreamLight.iss -Pattern '^#define AppVersion "(.+)"').Matches[0].Groups[1].Value
          if ($app -ne $iss) {
            throw "app\version.txt says $app but StreamLight.iss says $iss - bump both (CLAUDE.md section 3)"
          }
          "version=$app" >> $env:GITHUB_OUTPUT
          $state = if ($env:SIGNPATH_ENABLED -eq 'true') { "signed-$env:SIGNPATH_POLICY" } else { 'unsigned' }
          "state=$state" >> $env:GITHUB_OUTPUT
          Write-Host "StreamLight $app ($state)"

      - name: Install Qt ${{ env.QT_VERSION }}
        # Pinned to a commit, not the moving v4 branch: a third-party action runs inside the
        # build whose output gets signed. a9c63c7 = tag v4.4.1, the commit v4 resolved to on 17/10/2026.
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          # aqtinstall 3.3.0 (the last release, June 2025) looks for Qt 6.12 under qt6_6120/qt6_6120/,
          # but since 6.11 Qt publishes one folder per arch (qt6_6120_msvc2022_64/) and the install
          # fails with "Failed to locate XML data". The fix (miurahr/aqtinstall#1000) is on master
          # since 24/03/2026 but in no release: pinned to master's head of 11/09/2026 until 3.4.0.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $tag = 'is-' + ($env:INNO_VERSION -replace '\.', '_')
          $exe = "$env:RUNNER_TEMP\innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download does not match the pinned SHA-256 ($hash)" }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\InnoSetup7' -Wait
          if (-not (Test-Path 'C:\InnoSetup7\ISCC.exe')) { throw 'ISCC.exe not found after installing Inno Setup' }

      - name: Show toolchain
        shell: pwsh
        run: |
          $vs = & scripts\vswhere.exe -latest -property installationPath
          Write-Host "Visual Studio: $(& scripts\vswhere.exe -latest -property catalog_productDisplayVersion) at $vs"
          Write-Host "MSVC toolsets: $((Get-ChildItem "$vs\VC\Tools\MSVC" -Directory).Name -join ', ')"
          Write-Host "qmake: $((Get-Command qmake.exe).Source)"

      - name: Build (scripts\build-arch.bat release)
        shell: cmd
        env:
          STREAMLIGHT_DEPLOY_ONLY: '1'
        run: |
          set PATH=C:\Program Files\7-Zip;%PATH%
          call scripts\build-arch.bat release

      - name: Find VC_redist
        id: vcredist
        shell: pwsh
        run: |
          # The VC_redist of the toolset that just built the exe, as the local build does.
          # vswhere also lists a vNNN alias folder: keep the numbered one, highest first.
          $redist = & scripts\vswhere.exe -latest -find 'VC\Redist\MSVC\*\vc_redist.x64.exe' |
            Where-Object { (Split-Path (Split-Path $_ -Parent) -Leaf) -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version](Split-Path (Split-Path $_ -Parent) -Leaf) } -Descending |
            Select-Object -First 1
          if (-not $redist) { throw 'vc_redist.x64.exe not found in the runner''s Visual Studio' }
          Write-Host "VC_redist: $redist"
          "path=$redist" >> $env:GITHUB_OUTPUT

      - name: Build installer (StreamLight.iss)
        if: env.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        env:
          VCREDIST: ${{ steps.vcredist.outputs.path }}
        run: |
          & C:\InnoSetup7\ISCC.exe "/DVCRedist=$env:VCREDIST" StreamLight.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # ── Code signing (only with SIGNPATH_API_TOKEN) ───────────────────────────────────────────

      - name: Prepare the first signing request
        id: tosign
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          VCREDIST: ${{ steps.vcredist.outputs.path }}
        run: |
          # First ISCC pass: with SignUninstaller defined it writes uninst-<inno>-<hash>.e64 and stops
          # on purpose, asking for that file to be signed. Its name follows a hash of the binary, so
          # it changes with every release.
          $uninstDir = Join-Path $PWD 'build\signing\uninstaller'
          New-Item -ItemType Directory -Force $uninstDir | Out-Null
          & C:\InnoSetup7\ISCC.exe "/DVCRedist=$env:VCREDIST" /DSignUninstaller "/DSignedUninstallerDir=$uninstDir" StreamLight.iss
          Write-Host "First pass ended with $LASTEXITCODE (expected: non-zero, asking for the signature)"
          $uninst = @(Get-ChildItem $uninstDir -Filter 'uninst-*.e64')
          if ($uninst.Count -ne 1) { throw "Expected one uninst-*.e64 in $uninstDir, found $($uninst.Count)" }

          # The three files go to SignPath in one zip. The uninstaller travels as Uninstaller.exe,
          # the name the artifact configuration names; it goes back under its own name afterwards.
          $stage = Join-Path $PWD 'build\signing\to-sign'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\deploy-x64-release\StreamLight.exe, build\deploy-x64-release\AntiHooking.dll $stage
          Copy-Item $uninst[0].FullName (Join-Path $stage 'Uninstaller.exe')
          "uninstaller=$($uninst[0].Name)" >> $env:GITHUB_OUTPUT
          "uninstaller_dir=$uninstDir" >> $env:GITHUB_OUTPUT
          # GitHub's pwsh wrapper ends the step with `exit $LASTEXITCODE`, which would turn the
          # first pass's deliberate failure into a failed step.
          $global:LASTEXITCODE = 0

      - name: Upload files for the first signing request
        id: upload-to-sign
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StreamLight-${{ steps.version.outputs.version }}-binaries-to-sign
          path: build/signing/to-sign/
          if-no-files-found: error
          retention-days: 1

      - name: Sign StreamLight.exe, AntiHooking.dll and the uninstaller (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-to-sign.outputs.artifact-id }}
          parameters: |
            productVersion: "${{ steps.version.outputs.version }}.0"
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_SECONDS }}
          output-artifact-directory: build/signing/signed

      - name: Put the signed files in place
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          UNINSTALLER: ${{ steps.tosign.outputs.uninstaller }}
          UNINSTALLER_DIR: ${{ steps.tosign.outputs.uninstaller_dir }}
        run: |
          $signed = 'build\signing\signed'
          foreach ($name in 'StreamLight.exe', 'AntiHooking.dll', 'Uninstaller.exe') {
            $sig = Get-AuthenticodeSignature (Join-Path $signed $name)
            if ($null -eq $sig.SignerCertificate) { throw "$name came back without a signature" }
            # A test-signing certificate is not trusted by Windows; only release-signing must be Valid.
            if ($env:SIGNPATH_POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') { throw "$name signature is $($sig.Status)" }
            Write-Host "$name signed by $($sig.SignerCertificate.Subject) ($($sig.Status))"
          }
          Copy-Item "$signed\StreamLight.exe", "$signed\AntiHooking.dll" build\deploy-x64-release -Force
          Copy-Item "$signed\Uninstaller.exe" (Join-Path $env:UNINSTALLER_DIR $env:UNINSTALLER) -Force

      - name: Build installer around the signed uninstaller (StreamLight.iss, second pass)
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          VCREDIST: ${{ steps.vcredist.outputs.path }}
          UNINSTALLER_DIR: ${{ steps.tosign.outputs.uninstaller_dir }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & C:\InnoSetup7\ISCC.exe "/DVCRedist=$env:VCREDIST" /DSignUninstaller "/DSignedUninstallerDir=$env:UNINSTALLER_DIR" StreamLight.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC second pass failed ($LASTEXITCODE)" }
          $stage = 'build\signing\installer-to-sign'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build\installer\StreamLight_${env:VERSION}_Installer.exe" $stage

      - name: Upload the installer for the second signing request
        id: upload-installer-to-sign
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StreamLight-${{ steps.version.outputs.version }}-installer-to-sign
          path: build/signing/installer-to-sign/
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer-to-sign.outputs.artifact-id }}
          parameters: |
            productVersion: "${{ steps.version.outputs.version }}.0"
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_SECONDS }}
          output-artifact-directory: build/signing/signed-installer

      - name: Put the signed installer in place
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "StreamLight_${env:VERSION}_Installer.exe"
          $sig = Get-AuthenticodeSignature "build\signing\signed-installer\$name"
          if ($null -eq $sig.SignerCertificate) { throw "$name came back without a signature" }
          if ($env:SIGNPATH_POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') { throw "$name signature is $($sig.Status)" }
          Write-Host "$name signed by $($sig.SignerCertificate.Subject) ($($sig.Status))"
          Copy-Item "build\signing\signed-installer\$name" build\installer -Force

      # ── Results ───────────────────────────────────────────────────────────────────────────────

      - name: Summary
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $deploy = 'build\deploy-x64-release'
          $files = Get-ChildItem $deploy -Recurse -File
          $setup = Get-Item "build\installer\StreamLight_${ver}_Installer.exe"
          $unsigned = Get-ChildItem $deploy -Recurse -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
            ForEach-Object { $_.FullName.Substring((Resolve-Path $deploy).Path.Length + 1) }
          $setupSig = Get-AuthenticodeSignature $setup.FullName
          $setupSigner = if ($setupSig.SignerCertificate) { "$($setupSig.SignerCertificate.Subject -replace ',.*', '') ($($setupSig.Status))" } else { 'not signed' }
          @(
            "### StreamLight $ver (${{ steps.version.outputs.state }})"
            ''
            "- Deploy folder: $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"
            "- Installer: ``$($setup.Name)``, $([math]::Round($setup.Length / 1MB, 1)) MB, SHA-256 ``$((Get-FileHash $setup.FullName).Hash.ToLowerInvariant())``"
            "- Installer signature: $setupSigner"
            ''
            "Executables and DLLs in the deploy folder without a valid signature ($($unsigned.Count)):"
            ''
            ($unsigned | ForEach-Object { "- ``$_``" })
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload deploy folder
        uses: actions/upload-artifact@v7
        with:
          name: StreamLight-${{ steps.version.outputs.version }}-deploy-${{ steps.version.outputs.state }}
          path: build/deploy-x64-release/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .exe as it is, not inside a zip: the artifact downloads as
          # StreamLight_X.Y.Z_Installer.exe (the action names it after the file and ignores `name`).
          path: build/installer/StreamLight_${{ steps.version.outputs.version }}_Installer.exe
          archive: false
          if-no-files-found: error

      - name: Upload debugging symbols
        uses: actions/upload-artifact@v7
        with:
          name: StreamLight-${{ steps.version.outputs.version }}-symbols
          path: build/symbols-x64-release/*.zip
          if-no-files-found: warn
